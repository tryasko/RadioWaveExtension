<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Wave</title>

    <style>
      :root {
        color-scheme: light dark;
        --accent: #2f7df4;
        --accent-strong: #1769e8;
        --accent-soft: #edf5ff;
        --background: #ffffff;
        --surface: #ffffff;
        --surface-muted: #f7f9fc;
        --surface-hover: #f3f6fa;
        --border: #e3e8ef;
        --text: #12213d;
        --text-muted: #72809a;
        --icon: #73819a;
        --slider-track: #e4e9f0;
        --shadow: 0 12px 32px rgba(20, 34, 58, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #4b91ff;
          --accent-strong: #72aaff;
          --accent-soft: #192d4b;
          --background: #11161d;
          --surface: #171d25;
          --surface-muted: #1b222c;
          --surface-hover: #202833;
          --border: #2b3542;
          --text: #f5f7fb;
          --text-muted: #9aa7ba;
          --icon: #9ca9bb;
          --slider-track: #333d4a;
          --shadow: 0 16px 38px rgba(0, 0, 0, 0.42);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 300px;
        min-width: 300px;
        overflow: hidden;
      }

      body {
        background: var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .popup {
        height: 400px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .header {
        height: 50px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
      }

      .waveform,
      .mini-wave {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .waveform span,
      .mini-wave span {
        display: block;
        border-radius: 999px;
        background: var(--accent);
      }

      .brand-name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .playback-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
      }

      body[data-playback="played"] .playback-status {
        color: var(--accent);
      }

      body[data-playback="played"] .status-dot {
        background: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      body[data-playback="switching"] .playback-status {
        color: var(--accent);
      }

      body[data-playback="switching"] .status-dot {
        box-sizing: border-box;
        background: transparent;
        border: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
        border-top-color: var(--accent);
        animation: status-spin 700ms linear infinite;
      }

      @keyframes status-spin {
        to { transform: rotate(360deg); }
      }

      .player {
        padding: 13px 12px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-muted);
      }

      .now-playing {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 52px;
        align-items: center;
        gap: 10px;
      }

      .play-button {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(145deg, #4897ff, #236ee8);
        box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent);
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      .play-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 38%, transparent);
      }

      .play-button:active {
        transform: scale(0.97);
      }

      .play-button:focus-visible,
      .station-row:focus-visible,
      .volume-control:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: 2px;
      }

      .play-button svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }

      .play-button .icon-pause,
      .play-button[data-state="played"] .icon-play {
        display: none;
      }

      .play-button[data-state="played"] .icon-pause {
        display: block;
      }

      .station-meta {
        min-width: 0;
      }

      .station-name {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.025em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .station-group,
      .group-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 20px;
        margin-top: 5px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text-muted);
        background: var(--surface);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }

      .waveform {
        height: 32px;
        gap: 4px;
        opacity: 0.8;
      }

      .waveform span {
        width: 3px;
        transform: scaleY(0.32);
        transform-origin: center;
        transition: transform 180ms ease, opacity 180ms ease;
        will-change: transform;
      }

      .waveform span:nth-child(1),
      .waveform span:nth-child(7) {
        height: 10px;
      }

      .waveform span:nth-child(2),
      .waveform span:nth-child(6) {
        height: 18px;
      }

      .waveform span:nth-child(3),
      .waveform span:nth-child(5) {
        height: 25px;
      }

      .waveform span:nth-child(4) {
        height: 32px;
      }

      body[data-playback="played"] .waveform span,
      body[data-playback="played"] .mini-wave span {
        animation: music-wave 720ms ease-in-out infinite;
      }

      body[data-playback="played"] .waveform span:nth-child(1),
      body[data-playback="played"] .mini-wave span:nth-child(1) {
        animation-duration: 620ms;
        animation-delay: -410ms;
      }

      body[data-playback="played"] .waveform span:nth-child(2),
      body[data-playback="played"] .mini-wave span:nth-child(2) {
        animation-duration: 830ms;
        animation-delay: -120ms;
      }

      body[data-playback="played"] .waveform span:nth-child(3),
      body[data-playback="played"] .mini-wave span:nth-child(3) {
        animation-duration: 710ms;
        animation-delay: -560ms;
      }

      body[data-playback="played"] .waveform span:nth-child(4) {
        animation-duration: 920ms;
        animation-delay: -260ms;
      }

      body[data-playback="played"] .waveform span:nth-child(5) {
        animation-duration: 670ms;
        animation-delay: -480ms;
      }

      body[data-playback="played"] .waveform span:nth-child(6) {
        animation-duration: 790ms;
        animation-delay: -180ms;
      }

      body[data-playback="played"] .waveform span:nth-child(7) {
        animation-duration: 580ms;
        animation-delay: -350ms;
      }

      body[data-playback="paused"] .waveform span,
      body[data-playback="switching"] .waveform span {
        opacity: 0.65;
        animation: loading-wave 900ms ease-in-out infinite;
      }

      @keyframes music-wave {
        0%, 100% { transform: scaleY(0.28); }
        22% { transform: scaleY(0.88); }
        48% { transform: scaleY(0.42); }
        72% { transform: scaleY(1); }
      }

      @keyframes loading-wave {
        0%, 100% { transform: scaleY(0.08); }
        50% { transform: scaleY(0.16); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        body[data-playback="played"] .waveform span,
        body[data-playback="played"] .mini-wave span {
          animation-duration: 1200ms !important;
          animation-iteration-count: infinite !important;
        }

        body[data-playback="paused"] .waveform span,
        body[data-playback="switching"] .waveform span {
          animation-duration: 1600ms !important;
          animation-iteration-count: infinite !important;
        }
      }

      .volume-row {
        display: grid;
        grid-template-columns: 20px 1fr 20px;
        align-items: center;
        gap: 9px;
        margin-top: 10px;
        color: var(--icon);
      }

      .volume-row svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .volume-control {
        width: 100%;
        height: 20px;
        border: 0;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
      }

      .volume-control::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(to right, var(--accent) 0 var(--volume, 30%), var(--slider-track) var(--volume, 30%) 100%);
      }

      .volume-control::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        cursor: grab;
        appearance: none;
        -webkit-appearance: none;
        background: var(--accent);
        box-shadow: 0 1px 5px rgba(18, 33, 61, 0.28);
      }

      .volume-control::-moz-range-track {
        height: 4px;
        border: 0;
        border-radius: 999px;
        background: var(--slider-track);
      }

      .volume-control::-moz-range-progress {
        height: 4px;
        border-radius: 999px;
        background: var(--accent);
      }

      .volume-control::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: var(--accent);
      }

      .station-list {
        height: 246px;
        overflow-x: hidden;
        overflow-y: auto;
        list-style: none;
        background: var(--surface);
        scrollbar-color: var(--border) transparent;
        scrollbar-width: thin;
      }

      .station-list::-webkit-scrollbar {
        width: 6px;
      }

      .station-list::-webkit-scrollbar-thumb {
        border: 1px solid var(--surface);
        border-radius: 999px;
        background: var(--border);
      }

      .station-list li {
        position: relative;
        height: 38px;
        border-bottom: 1px solid var(--border);
      }

      .station-list li:last-child {
        border-bottom: 0;
      }

      .station-list li::before {
        content: "";
        width: 3px;
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 1;
        background: transparent;
      }

      .station-list li.selected::before {
        background: var(--accent);
      }

      .station-row {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 24px;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 0;
        cursor: pointer;
        text-align: left;
        background: transparent;
        transition: background-color 120ms ease;
      }

      .station-row:hover {
        background: var(--surface-hover);
      }

      .selected .station-row {
        background: var(--accent-soft);
      }

      .switching .station-row {
        background: var(--accent-soft);
      }

      .group-badge {
        width: fit-content;
        margin: 0;
        background: var(--surface-muted);
      }

      .selected .group-badge {
        border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
        color: var(--accent-strong);
        background: color-mix(in srgb, var(--accent) 8%, var(--surface));
      }

      .list-station-name {
        overflow: hidden;
        font-size: 14px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .selected .list-station-name {
        color: var(--accent-strong);
      }

      .station-action {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        color: var(--icon);
      }

      .station-action::before {
        content: "";
        width: 0;
        height: 0;
        margin-left: 2px;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 9px solid currentColor;
      }

      .mini-wave {
        display: none;
        height: 20px;
        gap: 3px;
      }

      .mini-wave span {
        width: 3px;
        height: 10px;
        transform: scaleY(0.32);
        transform-origin: center;
        will-change: transform;
      }

      .mini-wave span:nth-child(2) {
        height: 20px;
      }

      .station-list li.switching .station-action::before {
        width: 13px;
        height: 13px;
        box-sizing: border-box;
        margin: 0;
        border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: status-spin 700ms linear infinite;
      }

      .station-list li.switching .mini-wave {
        display: none;
      }

      body[data-playback="played"] .selected .station-action::before {
        display: none;
      }

      body[data-playback="played"] .selected .mini-wave {
        display: inline-flex;
      }
    </style>
  </head>

  <body data-playback="paused">
    <main class="popup">
      <header class="header">
        <img class="brand-mark" src="../icons/64.png" width="24" height="24" alt="" aria-hidden="true" />
        <span class="brand-name">Radio Wave</span>
        <span class="playback-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="playback_status_text">PAUSED</span>
        </span>
      </header>

      <section class="player" aria-label="Керування відтворенням">
        <div class="now-playing">
          <button id="cnt_play" class="play-button" type="button" data-state="paused" aria-label="Відтворити">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.1-6.8a1.1 1.1 0 0 0 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2Z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13A1.5 1.5 0 0 1 9.5 20h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z" />
            </svg>
          </button>

          <div class="station-meta">
            <strong id="current_station_name" class="station-name">Мелодія FM</strong>
            <span id="current_station_group" class="station-group">TVR</span>
          </div>

          <span class="waveform" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </span>
        </div>

        <div class="volume-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5v5h4l5 4V5.5l-5 4H4Z" />
          </svg>
          <input id="cnt_volume" class="volume-control" type="range" min="0" max="100" step="1" aria-label="Гучність" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9.5v5h4l5 4V5.5l-5 4H3Zm12.5-.8a1 1 0 0 1 1.4.2 5 5 0 0 1 0 6.2 1 1 0 1 1-1.6-1.2 3 3 0 0 0 0-3.8 1 1 0 0 1 .2-1.4Zm3-3a1 1 0 0 1 1.4.2 10 10 0 0 1 0 12.2 1 1 0 1 1-1.6-1.2 8 8 0 0 0 0-9.8 1 1 0 0 1 .2-1.4Z" />
          </svg>
        </div>
      </section>

      <ul id="play_list" class="station-list" aria-label="Радіостанції"></ul>
    </main>

    <script type="module" src="./application.js"></script>
  </body>
</html>
